<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City4Christ | Verify Email</title><style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3effa;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000015;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .login-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 3px #d4af37;
        }

        h1 {
            color: #55268a;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #55268a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            text-align: center;
        }
    
a{color:#55268a}</style><script src="js/c4c-api.js" defer></script><script src="js/verify.js" defer></script></head><body><main class="login-card"><div class="login-brand"><img src="assets/images/logo.jpeg" class="login-logo" alt="City4Christ logo"><h1>City4Christ</h1></div><p>Verify Email</p><p><a href="index.html">← Back to Welcome</a></p><p>Check your inbox for the 8-digit email verification code.</p>
<form id="verifyForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required>
<label for="code">Verification code</label><input id="code" inputmode="numeric" maxlength="8" minlength="8" pattern="[0-9]{8}" required>
<button type="submit" id="submitButton">Verify Email</button></form>
<button type="button" id="resendButton" style="background:#eee;color:#55268a;margin-top:10px">Resend Code</button>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="login.html">Back to login</a></p></main></body></html>

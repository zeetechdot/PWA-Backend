<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City4Christ | Create Account</title><style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f3effa;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000015;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .login-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 3px #d4af37;
        }

        h1 {
            color: #55268a;
            text-align: center;
        }

        p {
            color: #666;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #55268a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            text-align: center;
        }
    
a{color:#55268a}</style><script src="js/c4c-api.js" defer></script><script src="js/register.js" defer></script></head><body><main class="login-card"><div class="login-brand"><img src="assets/images/logo.jpeg" class="login-logo" alt="City4Christ logo"><h1>City4Christ</h1></div><p>Create Account</p><p><a href="index.html">← Back to Welcome</a></p><form id="registerForm">
<label for="firstName">First name</label><input id="firstName" autocomplete="given-name" maxlength="100" required>
<label for="lastName">Last name</label><input id="lastName" autocomplete="family-name" maxlength="100" required>
<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Create password (at least 15 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="15" required>
<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="15" required>
<button type="submit" id="submitButton">Create Account</button></form>
<p id="message" role="status" aria-live="polite"></p>
<p>Already a member? <a href="login.html">Log in</a></p></main></body></html>
